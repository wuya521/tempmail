# ============================================================
# TempMail 临时邮箱平台 - Docker Compose
# 高并发架构: PostgreSQL + PgBouncer + Redis + Go API + Postfix
# ============================================================
#
# ╔══════════════════════════════════════════════════════════════╗
# ║                          端口速查表                           ║
# ╠══════════════╦════════════╦══════════════════════════════════╣
# ║ 端口         ║  服务       ║ 说明                             ║
# ╠══════════════╬════════════╬══════════════════════════════════╣
# ║ 8880(对外)   ║ frontend   ║ Web 界面（默认 8880，避免与宝塔等占用 80） ║
# ║ 8080(对外)   ║ api        ║ Go API（建议生产环境关闭对外）      ║
# ║ 25  (对外)   ║ postfix    ║ SMTP 收信，必须对外开放            ║
# ╠══════════════╬════════════╬══════════════════════════════════╣
# ║ 5432(内部)   ║ postgres   ║ 数据库，仅容器内互通             ║
# ║ 6432(内部)   ║ pgbouncer  ║ 连接池，仅容器内互通             ║
# ║ 6379(内部)   ║ redis      ║ 缓存，仅容器内互通               ║
# ╚══════════════╩════════════╩══════════════════════════════════╝
#
# ★ 想修改对外端口？格式是 "宿主机端口:容器内端口"
#   只改冒号左边（宿主机端口），右边不要动。
#   默认 Web 为 8880:80；若要用 80，需宿主机 80 未被占用，或仅用宝塔反代到 127.0.0.1:8880。
#
name: tempmail

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=500"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ==================== PgBouncer (连接池) ====================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ==================== Redis ====================
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--tcp-backlog"
      - "511"
      - "--timeout"
      - "300"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ==================== Go API 服务 ====================
  # 使用本仓库 api/ 源码构建（与 GitHub 代码一致，不依赖第三方镜像）
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: tempmail-api:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      DB_DSN: ${API_DB_DSN}
      REDIS_ADDR: ${API_REDIS_ADDR}
      REDIS_PASSWORD: ${API_REDIS_PASSWORD}
      RATE_LIMIT: ${API_RATE_LIMIT}
      RATE_WINDOW: ${API_RATE_WINDOW}
      PORT: ${API_PORT}
      SMTP_SERVER_IP: ${SMTP_SERVER_IP}
      SMTP_HOSTNAME: ${SMTP_HOSTNAME}
      ADMIN_KEY_FILE: /data/admin.key
      # 收款码等文件目录（默认 /data/shop，已含在 ./data 卷内）
      SHOP_ASSET_DIR: /data/shop
      # 支付宝当面付（可选，见 .env.example；私钥勿提交仓库）
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal

  # ==================== 前端 Nginx ====================
  # 宿主机 8880 → 容器 80（与常见云安全组「邮箱/Web」放行端口一致，且避免与宝塔 Nginx 抢 80）
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8880:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - internal

  # ==================== Postfix 收件服务 ====================
  # 使用本仓库 postfix/ 构建（构建上下文为项目根目录，因 Dockerfile 内 COPY postfix/...）
  postfix:
    build:
      context: .
      dockerfile: postfix/Dockerfile
    image: tempmail-postfix:local
    restart: unless-stopped
    ports:
      - "25:25"
    environment:
      DB_DSN: ${API_DB_DSN}
    depends_on:
      pgbouncer:
        condition: service_started
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
